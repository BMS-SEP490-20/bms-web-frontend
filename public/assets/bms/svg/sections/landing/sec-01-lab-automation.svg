<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <style>
      @keyframes ecgHeartbeat {
        0% { stroke-dashoffset: 60; }
        60% { stroke-dashoffset: 0; }
        90% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 60; }
      }
      @keyframes pulseLed {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.25; transform: scale(1.2); }
      }
      .ecg-line {
        animation: ecgHeartbeat 2.8s ease-in-out infinite;
      }
      .led-dot {
        animation: pulseLed 1.4s ease-in-out infinite;
      }
    </style>
  </defs>

