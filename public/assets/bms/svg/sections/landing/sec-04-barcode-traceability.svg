<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Soft Drop Shadow Filter for Scanner Card -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left: Barcode Scanner Frame & Bars -->
  <g transform="translate(40 24) scale(1.6)">
    <!-- White Card Background -->
    <rect x="13" y="24" width="70" height="47" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    
    <!-- Barcode 1D Lines -->
    <rect x="24" y="35" width="1.6" height="25" rx="0" fill="#0F172A" stroke="none"/>
    <rect x="27.2" y="35" width="3.2" height="25" rx="0" fill="#0F172A" stroke="none"/>
    <rect x="32.0" y="35" width="1.6" height="25" rx="0" fill="#0F172A" stroke="none"/>
    <rect x="35.2" y="35" width="4.8" height="25" rx="0" fill="#0F172A" stroke="none"/>
    <rect x="41.6" y="35" width="1.6" height="25" rx="0" fill="#0F172A" stroke="none"/>
    <rect x="44.8" y="35" width="1.6" height="25" rx="0" fill="#0F172A" stroke="none"/>
    <rect x="48.0" y="35" width="3.2" height="25" rx="0" fill="#0F172A" stroke="none"/>
    <rect x="52.8" y="35" width="1.6" height="25" rx="0" fill="#0F172A" stroke="none"/>
    <rect x="56.0" y="35" width="3.2" height="25" rx="0" fill="#0F172A" stroke="none"/>
    <rect x="60.8" y="35" width="4.8" height="25" rx="0" fill="#0F172A" stroke="none"/>
    <rect x="67.2" y="35" width="1.6" height="25" rx="0" fill="#0F172A" stroke="none"/>

    <!-- Blue Viewfinder Reticle Corners -->
    <path d="M8 32V15h18m44 0h18v17M8 64v17h18m44 0h18V64" fill="none" stroke="#1E60E6" stroke-width="2.5"/>

    <!-- Dynamic Scanning Laser Beam (Pure Native SVG SMIL Animation, 100% Cross-Browser Support) -->
    <!-- Wide Diffuse Green Glow -->
    <line x1="16" y1="32" x2="80" y2="32" stroke="#34D399" stroke-width="6" stroke-linecap="round" opacity="0.4">
      <animate attributeName="y1" values="30;64;30" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="30;64;30" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.75;0.3" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <!-- Intense Sharp Core Laser -->
    <line x1="16" y1="32" x2="80" y2="32" stroke="#10B981" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="y1" values="30;64;30" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="30;64;30" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <!-- Laser Endpoint Flare Dots -->
    <circle cx="16" cy="32" r="2.5" fill="#10B981">
      <animate attributeName="cy" values="30;64;30" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="32" r="2.5" fill="#10B981">
      <animate attributeName="cy" values="30;64;30" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right: Blood Collection Specimen Tube (EDTA Violet Cap) -->
  <g transform="translate(240 88) scale(0.95)">
    <!-- Glass Tube Body -->
    <path d="M35 21h26v53a13 13 0 0 1-26 0Z" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <!-- Red Blood Column -->
    <path d="M39 56h18v18a9 9 0 0 1-18 0Z" fill="#EF4444" stroke="none"/>
    <!-- Purple/Lavender EDTA Hemogard Cap -->
    <rect x="32" y="11" width="32" height="15" rx="4" fill="#7C3AED" stroke="none"/>
    <path d="M35 26H61" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <path d="M37 14L37 21" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M42 14L42 21" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M47 14L47 21" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M52 14L52 21" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M57 14L57 21" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Specimen Barcode Label Sticker -->
    <rect x="38" y="32" width="20" height="19" rx="2" fill="#F1F5F9" stroke="none"/>
    <rect x="41" y="36" width="0.6" height="10" fill="#0F172A" stroke="none"/>
    <rect x="42.5" y="36" width="1.2" height="10" fill="#0F172A" stroke="none"/>
    <rect x="44.5" y="36" width="0.6" height="10" fill="#0F172A" stroke="none"/>
    <rect x="46" y="36" width="1.6" height="10" fill="#0F172A" stroke="none"/>
    <rect x="48.5" y="36" width="0.6" height="10" fill="#0F172A" stroke="none"/>
    <rect x="50" y="36" width="1.2" height="10" fill="#0F172A" stroke="none"/>
    <rect x="52" y="36" width="0.6" height="10" fill="#0F172A" stroke="none"/>
    <rect x="53.5" y="36" width="1.4" height="10" fill="#0F172A" stroke="none"/>
    <!-- Meniscus / Glass Glare Line -->
    <path d="M40 63L40 73" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Middle: Animated Digital Data Stream Connection (Barcode -> Specimen Tube) -->
  <path d="M216 88h36q18 0 18 18" fill="none" stroke="#1E60E6" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Pulsing Origin Status Dot -->
  <circle cx="216" cy="88" r="4.5" fill="#10B981">
    <animate attributeName="r" values="3.5;6;3.5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Target Tube Receiving Dot -->
  <circle cx="270" cy="106" r="3.5" fill="#1E60E6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
